[workspace]
members = ["crates/teamcraft-store", "crates/teamcraft-core", "crates/teamcraft-mcp"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sandraschi fleet"]
repository = "https://github.com/sandraschi/teamcraft"

[workspace.dependencies]
craft-biz = { path = "../craft-biz/crates/craft-biz" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
